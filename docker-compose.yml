name: multimessenger

# Инфраструктура для локальной разработки: PostgreSQL и MinIO.
# Само приложение на этом этапе запускается через `dotnet run` — так проще дебажить.
# Контейнеризация MultiMessenger.Web добавляется в разделе 1.7 плана.
#
# Значения берутся из файла .env (см. .env.example). Порты публикуются только
# на 127.0.0.1, чтобы БД и хранилище не торчали в локальную сеть.

services:

  postgres:
    image: postgres:16
    container_name: mm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Инициализация кластера с поддержкой русской сортировки и регистронезависимого поиска
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio
    container_name: mm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"    # S3 API — сюда ходит приложение
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001" # веб-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
