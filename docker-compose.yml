name: multimessenger

# Инфраструктура и приложение.
#
# Приложение вынесено в профиль `app`: при разработке его удобнее запускать
# через `dotnet run`, а контейнер поднимать только когда нужно проверить сборку
# целиком — `docker compose --profile app up -d`.
#
# Значения берутся из файла .env (см. .env.example). Порты публикуются только
# на 127.0.0.1, чтобы БД и хранилище не торчали в локальную сеть.

services:

  postgres:
    image: postgres:16
    container_name: mm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Инициализация кластера с поддержкой русской сортировки и регистронезависимого поиска
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio
    container_name: mm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"    # S3 API — сюда ходит приложение
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001" # веб-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: multimessenger:local
    container_name: mm-app
    restart: unless-stopped
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Внутри docker-сети хосты — это имена сервисов, а не localhost.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__UseSsl: "false"
      Seed__AdminPhoneNumber: ${SEED_ADMIN_PHONE:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      # Файлы сессий Telegram/WhatsApp переживают пересоздание контейнера.
      - sessions:/data/sessions
      - dataprotection:/data/keys

  # Просмотр структурированных логов. Не входит в основной стек — поднимается отдельно:
  #   docker compose --profile observability up -d
  # Приложение начнёт отправлять события, когда задан Seq:ServerUrl (по умолчанию пусто).
  seq:
    image: datalust/seq:latest
    container_name: mm-seq
    restart: unless-stopped
    profiles: [observability]
    environment:
      ACCEPT_EULA: "Y"
      # Начиная со свежих версий Seq не стартует без пароля администратора.
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${SEQ_UI_PORT:-5341}:80"
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  minio-data:
  seq-data:
  sessions:
  dataprotection:
