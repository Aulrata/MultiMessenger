version: 2

# Ветка по умолчанию — main, но вливание в неё запускает выкатку на сервер.
# Поэтому обновления идут в dev и попадают в прод обычным порядком,
# вместе с остальными изменениями, а не отдельным перезапуском на каждый пакет.

updates:
  # NuGet-пакеты. Обновления группируются, чтобы не получать десять
  # почти одинаковых pull request каждый понедельник.
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      testing:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "NSubstitute"
          - "Testcontainers*"
          - "coverlet*"
    ignore:
      # Начиная с 8.0 требует платную лицензию для коммерческого использования —
      # обновляться нельзя, см. комментарий в Directory.Packages.props.
      - dependency-name: FluentAssertions
        versions: [">=8.0.0"]

  # Версии действий тоже группируются: обновление пяти action'ов —
  # это одна правка в двух файлах, а не пять отдельных разборов.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
