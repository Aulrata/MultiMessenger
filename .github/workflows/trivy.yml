name: Trivy

# CodeQL проверяет наш код, а Trivy — то, что вокруг него в образе:
# системные пакеты Debian и библиотеки рантайма.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Уязвимости находят в уже собранных образах: код не менялся, а дырка появилась.
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Сканирование образа
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v4

      # Образ собирается локально и не публикуется: на pull request проверять
      # надо то, что получится после вливания, а в реестре этого ещё нет.
      - name: Сборка образа
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: multimessenger:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Сканирование, отчёт в SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: multimessenger:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret

      # Результаты уезжают во вкладку Security рядом с находками CodeQL.
      - name: Публикация результатов
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Отдельный прогон, который валит сборку. Условие узкое намеренно:
      # только критические уязвимости и только те, для которых уже вышло
      # исправление. Иначе проверка краснела бы на каждую дырку в Debian,
      # которую нам всё равно нечем закрыть, и на неё перестали бы смотреть.
      - name: Проверка критических уязвимостей
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: multimessenger:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
